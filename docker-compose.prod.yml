# ─────────────────────────────────────────────────────────────────────────────
# PROL - Production deployment (Traefik + Dokploy)
# Deploys the web app and a dedicated PostgreSQL instance on the VPS.
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-prol}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-prol}
    volumes:
      - prol_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prol} -d ${DB_NAME:-prol}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prol-internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-prol}:${DB_PASSWORD}@db:5432/${DB_NAME:-prol}?schema=public

      # Archivos confidenciales (evidencias y plantillas por empresa)
      PRIVATE_UPLOAD_DIR: ${PRIVATE_UPLOAD_DIR:-/app/private-uploads}

      # Cloudflare R2 (tier confidencial). Las cuatro juntas o ninguna: con
      # R2_BUCKET y sin las otras tres el contenedor arranca, avisa en el log y
      # rechaza las subidas confidenciales. Sin ninguna, los archivos van a
      # PRIVATE_UPLOAD_DIR.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      # Prefijo dentro del bucket. Cambiarlo NO mueve objetos: hay que copiarlos
      # antes o la instancia deja de encontrar sus archivos.
      R2_KEY_PREFIX: ${R2_KEY_PREFIX:-}

      # App URL & Auth
      # `APP_URL`/`APP_DOMAIN` son las que lee la aplicación: las `NEXT_PUBLIC_*`
      # se sustituyen por su valor durante el build y nunca reflejan el entorno
      # del contenedor. Se siguen pasando porque una imagen anterior a la
      # separación todavía las usa, y así el mismo env file sirve para ambas
      # durante la transición.
      APP_URL: ${APP_URL}
      APP_DOMAIN: ${APP_DOMAIN}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_DOMAIN: ${APP_DOMAIN}

      # Identidad de la instancia (vacías = comportamiento histórico de PROL)
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_TAGLINE: ${BRAND_TAGLINE:-}
      BRAND_DESCRIPTION: ${BRAND_DESCRIPTION:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      POWERED_BY_ENABLED: ${POWERED_BY_ENABLED:-}
      POWERED_BY_NAME: ${POWERED_BY_NAME:-}
      POWERED_BY_URL: ${POWERED_BY_URL:-}
      # Instancia dedicada a un solo tenant: el apex ES ese tenant.
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL}

      # Stripe
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      # Cloudflare Stream
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_STREAM_API_TOKEN: ${CLOUDFLARE_STREAM_API_TOKEN:-}

      # Email (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_DOMAIN: ${RESEND_DOMAIN:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}

      # Google Meet (opcional - links automáticos en sesiones virtuales)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      WORKSHOP_TIME_ZONE: ${WORKSHOP_TIME_ZONE:-America/Mexico_City}

      # Optional: AI (module 6 - opcional)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      TRIGGER_SECRET_KEY: ${TRIGGER_SECRET_KEY:-}
    volumes:
      # Persist uploaded files (PDFs, thumbnails, avatars) across rebuilds
      - prol_uploads:/app/apps/web/public/uploads
      # Evidencias y plantillas por empresa: FUERA de public/, sólo salen por /files/*
      - prol_private:/app/private-uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - prol-internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTPS router: main domain + wildcard subdomains for tenants (Traefik v3 regex)
      - "traefik.http.routers.prol.rule=Host(`${APP_DOMAIN}`) || HostRegexp(`^[a-z0-9-]+\\.${APP_DOMAIN_REGEX}$`)"
      - "traefik.http.routers.prol.entrypoints=websecure"
      - "traefik.http.routers.prol.tls=true"
      # `letsencrypt-dns` uses Cloudflare DNS-01 challenge (CF_DNS_API_TOKEN
      # already mounted into Traefik). HTTP-01 cannot validate wildcards;
      # DNS-01 can, so we can request a single cert covering the apex and
      # every tenant subdomain (`<slug>.prol.prosuite.pro`).
      - "traefik.http.routers.prol.tls.certresolver=letsencrypt-dns"
      - "traefik.http.routers.prol.tls.domains[0].main=${APP_DOMAIN}"
      - "traefik.http.routers.prol.tls.domains[0].sans=*.${APP_DOMAIN}"
      - "traefik.http.services.prol.loadbalancer.server.port=3000"
      # HTTP -> HTTPS redirect
      - "traefik.http.routers.prol-http.rule=Host(`${APP_DOMAIN}`) || HostRegexp(`^[a-z0-9-]+\\.${APP_DOMAIN_REGEX}$`)"
      - "traefik.http.routers.prol-http.entrypoints=web"
      - "traefik.http.routers.prol-http.middlewares=prol-redirect"
      - "traefik.http.middlewares.prol-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.prol-redirect.redirectscheme.permanent=true"

volumes:
  prol_db_data:
  prol_uploads:
  prol_private:

networks:
  prol-internal:
    driver: bridge
  dokploy-network:
    external: true
