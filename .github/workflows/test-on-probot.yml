name: Test on Probot

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      type:
        description: 'Tipo de testing'
        required: true
        default: 'both'
        type: choice
        options:
          - api
          - ui
          - both

jobs:
  test-on-probot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Test on Probot
        run: |
          npm install -g vitest axios @playwright/test

      - name: Run API tests
        if: github.event.inputs.type == 'api' || github.event.inputs.type == 'both' || github.event_name != 'workflow_dispatch'
        run: |
          npx test-on-probot --project PROL --type api --deploy-url ${{ secrets.DEPLOY_URL }}
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}

      - name: Run UI tests
        if: github.event.inputs.type == 'ui' || github.event.inputs.type == 'both' || github.event_name != 'workflow_dispatch'
        run: |
          npx test-on-probot --project PROL --type ui --deploy-url ${{ secrets.DEPLOY_URL }}
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('test-results/test-report.json', 'utf8');
            const data = JSON.parse(report);
            
            const body = `## Test on Probot Results
            
            ### API Tests
            - ✅ ${data.results.api.passed} passed
            - ❌ ${data.results.api.failed} failed
            
            ### UI Tests
            - ✅ ${data.results.ui.passed} passed
            - ❌ ${data.results.ui.failed} failed
            
            **Task ID:** ${data.task_id}
            **Timestamp:** ${data.timestamp}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  notify:
    needs: [test-on-probot]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Telegram
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.TELEGRAM_USER_ID }}\",\"text\":\"Tests completados para PROL\nPR: ${{ github.event.pull_request.number }}\nStatus: ${{ needs.test-on-probot.result == 'success' && 'PASS' || 'FAIL' }}\"}"
